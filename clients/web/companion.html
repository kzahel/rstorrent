<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/jstorrent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title data-l10n-id="shell.companion.title">JSTorrent Android</title>
  </head>
  <body>
    <header id="companion-identity" hidden></header>
    <section id="companion-bootstrap">
      <img class="companion-logo" src="/src/assets/jstorrent.png" width="56" height="56" alt="" />
      <h1 data-l10n-id="shell.companion.title">JSTorrent Android</h1>
      <p id="companion-status" role="status" data-l10n-id="shell.companion.loading">Starting the Android connection…</p>
      <a id="companion-update-android" hidden href="https://play.google.com/store/apps/details?id=com.jstorrent.app" target="_blank" rel="noopener noreferrer" data-l10n-id="android.companion.open-update">Open JSTorrent in Google Play</a>
      <button id="companion-cancel" type="button" data-l10n-id="shell.companion.cancel">Cancel</button>
      <p><a id="companion-help" href="../crostini/setup.html#android" target="_blank" rel="noopener noreferrer" data-l10n-id="android.companion.help">Setup and troubleshooting</a></p>
      <p><a id="companion-linux" href="../crostini/setup.html#linux" target="_blank" rel="noopener noreferrer" data-l10n-id="android.companion.linux">Use Linux instead</a></p>
      <button id="companion-preview" type="button" data-l10n-id="android.companion.support-preview">Preview connection support context</button>
      <p id="companion-context-privacy" hidden data-l10n-id="android.companion.support-privacy">Review before copying or sharing. This context contains no paths, accounts, credentials or torrent data. Nothing is uploaded.</p>
      <textarea id="companion-context" hidden readonly aria-labelledby="companion-preview" rows="16"></textarea>
    </section>
    <main id="app"></main>
    <script type="module" src="/src/companion-main.ts"></script>
  </body>
</html>
