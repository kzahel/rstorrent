[package]
name = "rstorrent-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "rstorrent_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rstorrent-session = { path = "../../../crates/rstorrent-session" }
rstorrent-media = { path = "../../../crates/rstorrent-media" }
rstorrent-platform = { path = "../../../crates/rstorrent-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tauri = { version = "2.11.5", features = [] }
tokio = { workspace = true, features = ["net", "rt", "sync"] }
tokio-util = { workspace = true }
