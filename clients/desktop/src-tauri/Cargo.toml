[package]
name = "rstorrent-desktop"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["direct-file-webrtc"]
direct-file-webrtc = ["rstorrent-remote-host/direct-file-webrtc"]

[lib]
name = "rstorrent_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rstorrent-session = { path = "../../../crates/rstorrent-session" }
rstorrent-media = { path = "../../../crates/rstorrent-media" }
rstorrent-native-host = { path = "../../../crates/rstorrent-native-host" }
rstorrent-remote-host = { path = "../../../crates/rstorrent-remote-host" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["native-tls", "zip"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["net", "rt", "sync"] }
tokio-util = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { workspace = true }
notify-rust = "=4.18.0"
zbus = "=5.19.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keepawake = "=0.6.1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "=0.55.0"

[dev-dependencies]
rcgen = "0.14.8"
rstorrent-remote-relay = { path = "../../../crates/rstorrent-remote-relay" }
