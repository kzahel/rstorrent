[package]
name = "rstorrent-desktop"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "rstorrent_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rstorrent-session = { path = "../../../crates/rstorrent-session" }
rstorrent-media = { path = "../../../crates/rstorrent-media" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = { version = "=2.10.1", default-features = false, features = ["native-tls", "zip"] }
tokio = { workspace = true, features = ["net", "rt", "sync"] }
tokio-util = { workspace = true }
url = { workspace = true }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
