<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JSTorrent Beta</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand-row">
        <img src="../icons/icon-32.png" width="32" height="32" alt="" />
        <div>
          <h1>JSTorrent Beta</h1>
          <p class="eyebrow">RSTorrent desktop bootstrap</p>
        </div>
      </div>

      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="status-dot checking"></span>
        <div>
          <p id="status-title" class="status-title">Checking desktop setup…</p>
          <p id="status-detail" class="status-detail">
            Looking for the RSTorrent native host.
          </p>
        </div>
      </section>

      <button id="launch" type="button" disabled>Open RSTorrent</button>
      <p class="footnote">
        This preview only checks and opens the desktop app. Torrent controls
        will arrive in a later beta.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
