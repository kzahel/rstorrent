name: RSTorrent
options:
  minimumXcodeGenVersion: 2.45.0
targets:
  RSTorrentSessionBindings:
    type: framework
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Generated/RSTorrentSession.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rstorrent.ios.dev.session-bindings
        PRODUCT_MODULE_NAME: RSTorrentSession
        PRODUCT_NAME: RSTorrentSession
        SWIFT_VERSION: "5.10"
        ARCHS: arm64
        MACH_O_TYPE: staticlib
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Generated"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Generated/RSTorrentSessionFFI.modulemap"
  RSTorrentIOSBindings:
    type: framework
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Generated/RSTorrentIOS.swift
    dependencies:
      - target: RSTorrentSessionBindings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rstorrent.ios.dev.ios-bindings
        PRODUCT_MODULE_NAME: RSTorrentIOS
        PRODUCT_NAME: RSTorrentIOS
        SWIFT_VERSION: "5.10"
        ARCHS: arm64
        MACH_O_TYPE: staticlib
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Generated"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Generated/RSTorrentIOSFFI.modulemap -Xcc -fmodule-map-file=$(SRCROOT)/Generated/RSTorrentSessionFFI.modulemap"
  RSTorrent:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    dependencies:
      - target: RSTorrentIOSBindings
      - target: RSTorrentSessionBindings
    resources:
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
    preBuildScripts:
      - name: Build Rust application library
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "${SRCROOT}/scripts/build-rust.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rstorrent.ios.dev
        PRODUCT_NAME: RSTorrent
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: arm64
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Generated"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Generated/RSTorrentIOSFFI.modulemap -Xcc -fmodule-map-file=$(SRCROOT)/Generated/RSTorrentSessionFFI.modulemap"
        OTHER_LDFLAGS: "$(inherited) -lrstorrent_ios -framework Security -framework SystemConfiguration -lsqlite3"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/../../target/aarch64-apple-ios/release"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/../../target/aarch64-apple-ios-sim/release"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
  RSTorrentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
      - path: App/RootEligibility.swift
      - path: App/RootRegistry.swift
    dependencies:
      - target: RSTorrent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rstorrent.ios.dev.tests
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  RSTorrentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    dependencies:
      - target: RSTorrent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.rstorrent.ios.dev.ui-tests
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RSTorrent
        CODE_SIGN_STYLE: Automatic
schemes:
  RSTorrent:
    build:
      targets:
        RSTorrent: all
        RSTorrentTests: [test]
        RSTorrentUITests: [test]
    test:
      targets:
        - RSTorrentTests
        - RSTorrentUITests
