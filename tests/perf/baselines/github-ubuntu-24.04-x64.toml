schema_version = 1
profile_id = "github-ubuntu-24.04-x64"
description = "Generous GitHub-hosted Ubuntu x64 catastrophe baseline"
calibration_status = "uncalibrated"

[requirements]
systems = ["linux"]
architectures = ["x86_64"]
minimum_logical_cpus = 2
minimum_memory_gib = 6
minimum_temporary_free_gib = 8
github_actions = true
github_runner_os = "Linux"
github_runner_arch = "X64"

[throughput]
smoke_runs = 1
full_runs = 1
timeout_seconds = 1200

[[throughput.cases]]
id = "1g-256k-4w4h"
tiers = ["smoke", "full"]
size_mib = 1024
piece_size_kib = 256
write_concurrency = 4
hash_concurrency = 4

[throughput.cases.required]
minimum_mib_s = 20.0
minimum_libtorrent_ratio = 0.10

[[throughput.cases]]
id = "1g-1m-4w4h"
