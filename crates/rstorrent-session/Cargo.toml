[package]
name = "rstorrent-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
uniffi = ["dep:uniffi"]

[dependencies]
rstorrent-engine = { path = "../rstorrent-engine" }
rstorrent-protocol = { path = "../rstorrent-protocol" }
getrandom = { workspace = true }
rusqlite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
ts-rs = { workspace = true }
uniffi = { version = "=0.31.0", default-features = false, optional = true }
