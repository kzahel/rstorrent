[package]
name = "rstorrent-headless"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["direct-file-webrtc"]
direct-file-webrtc = ["rstorrent-remote-host/direct-file-webrtc"]

[dependencies]
base64 = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
minisign-verify = { workspace = true }
reqwest = { workspace = true }
rstorrent-gateway = { path = "../rstorrent-gateway" }
rstorrent-remote-host = { path = "../rstorrent-remote-host" }
rstorrent-session = { path = "../rstorrent-session" }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rcgen = "0.14.8"
rstorrent-remote-relay = { path = "../rstorrent-remote-relay" }
