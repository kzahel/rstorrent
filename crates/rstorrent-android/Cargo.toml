[package]
name = "rstorrent-android"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "rstorrent-uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["bindgen"]

[dependencies]
rstorrent-engine = { path = "../rstorrent-engine" }
tokio = { workspace = true, features = ["rt", "time"] }
uniffi = { version = "=0.31.0", default-features = false }
