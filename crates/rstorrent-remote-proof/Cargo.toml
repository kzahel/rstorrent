[package]
name = "rstorrent-remote-proof"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
futures-util = { workspace = true, features = ["sink"] }
rand = { workspace = true, features = ["std", "std_rng"] }
rstorrent-gateway = { path = "../rstorrent-gateway" }
rstorrent-remote-crypto = { path = "../rstorrent-remote-crypto" }
rstorrent-remote-relay = { path = "../rstorrent-remote-relay" }
rstorrent-session = { path = "../rstorrent-session" }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
zeroize.workspace = true
