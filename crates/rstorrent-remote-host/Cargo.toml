[package]
name = "rstorrent-remote-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64.workspace = true
futures-util = { workspace = true, features = ["sink"] }
getrandom.workspace = true
p256.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
reqwest.workspace = true
rstorrent-gateway = { path = "../rstorrent-gateway" }
rstorrent-remote-access = { path = "../rstorrent-remote-access" }
rstorrent-remote-crypto = { path = "../rstorrent-remote-crypto", features = ["native"] }
rstorrent-remote-relay = { path = "../rstorrent-remote-relay" }
rstorrent-session = { path = "../rstorrent-session" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
rcgen = "0.14.8"
tempfile.workspace = true
