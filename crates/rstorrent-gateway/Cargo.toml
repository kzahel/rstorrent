[package]
name = "rstorrent-gateway"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
futures-util = { workspace = true, features = ["sink"] }
rstorrent-session = { path = "../rstorrent-session" }
rstorrent-platform = { path = "../rstorrent-platform" }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
tower-http = { workspace = true, features = ["cors", "fs"] }
ts-rs = { workspace = true }

[dev-dependencies]
sha1 = { workspace = true }
tokio-tungstenite = "0.29.0"
