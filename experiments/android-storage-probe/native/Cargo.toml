[package]
name = "rstorrent-android-storage-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2.189"

[workspace]

# Keep routine dev and test builds small while retaining file/line backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Opt into full source-level debugger data in an isolated output directory.
[profile.debugging]
inherits = "dev"
opt-level = 0
debug = "full"
