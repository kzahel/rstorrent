[workspace]
members = [
    "clients/desktop/src-tauri",
    "crates/rstorrent-android",
    "crates/rstorrent-engine",
    "crates/rstorrent-gateway",
    "crates/rstorrent-protocol",
    "crates/rstorrent-session",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
axum = "0.8.4"
futures-util = "0.3.31"
getrandom = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.6"
schemars = "1.2.2"
tokio = "1.47.1"
tokio-util = "0.7.16"
tower-http = "0.6.11"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

# Keep debug engine and desktop runs representative enough for networking,
# hashing, storage, and UI work while retaining debug assertions, debug info,
# and incremental compilation.
[profile.dev]
opt-level = 2
