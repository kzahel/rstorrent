[workspace]
members = [
    "clients/desktop/src-tauri",
    "crates/rstorrent-android",
    "crates/rstorrent-engine",
    "crates/rstorrent-gateway",
    "crates/rstorrent-media",
    "crates/rstorrent-platform",
    "crates/rstorrent-protocol",
    "crates/rstorrent-session",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs", "net", "process"] }
axum = "0.8.4"
async-compression = { version = "0.4", default-features = false, features = ["gzip", "tokio"] }
base64 = "0.22.1"
crypto-bigint = { version = "=0.7.5", default-features = false }
futures-util = "0.3.31"
getrandom = "0.3.4"
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rustls = { version = "0.23.43", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.6"
sha2 = "0.10.9"
schemars = "1.2.2"
tokio = "1.47.1"
tokio-util = "0.7.16"
tower-http = "0.6.11"
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }
url = "2.5.8"

# Keep ordinary engine and desktop runs representative enough for networking,
# hashing, storage, and UI work. Preserve the dev profile's debug assertions
# and overflow checks plus file/line backtraces, but avoid the full debug and
# incremental artifacts that rapidly exhaust disk space on macOS.
[profile.dev]
opt-level = 2
debug = "line-tables-only"
incremental = false

# Use this profile for deliberate source-level debugger sessions that need
# local variables and unoptimized control flow. It has a separate output
# directory so its full debug artifacts can be cleaned independently.
[profile.debugging]
inherits = "dev"
opt-level = 0
debug = "full"
