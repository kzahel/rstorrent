version: 2

# Security updates remain independent of these version-update PR limits.
# Keep routine patches reviewable; minor and major changes get their own PRs.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      cargo-patches:
        patterns: ["*"]
        update-types: [patch]

  - package-ecosystem: npm
    directory: /clients/web
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      web-patches:
        patterns: ["*"]
        update-types: [patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      website-patches:
        patterns: ["*"]
        update-types: [patch]

  - package-ecosystem: gradle
    directory: /clients/android
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      android-patches:
        patterns: ["*"]
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      actions-patches:
        patterns: ["*"]
        update-types: [patch]
