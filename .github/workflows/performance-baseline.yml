name: Performance baseline

on:
  pull_request:
    paths:
      - ".github/workflows/performance-baseline.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/rstorrent-engine/**"
      - "crates/rstorrent-session/**"
      - "tests/interop/**"
      - "tests/perf/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      tier:
        description: Baseline tier to execute
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: performance-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-ubuntu-x64:
    name: GitHub Ubuntu x64 (${{ github.event_name == 'schedule' && 'full' || inputs.tier || 'smoke' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PERFORMANCE_PROFILE: github-ubuntu-24.04-x64
      PERFORMANCE_TIER: ${{ github.event_name == 'schedule' && 'full' || inputs.tier || 'smoke' }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@889fac408b4da0905346410f253f0c55fbcb6613 # 1.97.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: tests/interop/uv.lock

      - name: Install Python 3.12 and locked interop environment
        run: |
          uv python install 3.12
          uv sync --project tests/interop --locked --python 3.12

      - name: Validate profile policy
        working-directory: tests/interop
        run: uv run --locked python -m unittest test_performance_profiles.py

      - name: Create evidence directory
        run: mkdir -p artifacts/performance

      - name: Compare engine throughput with libtorrent
        run: |
          uv run --project tests/interop --locked python tests/interop/local_throughput_compare.py \
            --baseline-profile "$PERFORMANCE_PROFILE" \
            --profile-tier "$PERFORMANCE_TIER" \
            --output artifacts/performance/engine-throughput.json

      - name: Measure application view overhead
        run: |
          uv run --project tests/interop --locked python tests/interop/application_view_throughput.py \
            --baseline-profile "$PERFORMANCE_PROFILE" \
            --profile-tier "$PERFORMANCE_TIER" \
            --output artifacts/performance/application-views.json

      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/performance/*.json
          if-no-files-found: warn
          retention-days: 30
